  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}:root{--primary:#00D4FF;--bg:#050A0F;--card:#0A1628;--text:#E8F4FD;--muted:#7A9BB5;--border:rgba(0,212,255,.2)}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif;line-height:1.7}nav{height:68px;position:fixed;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;background:rgba(5,10,15,.95);border-bottom:1px solid var(--border);z-index:2}.logo{color:var(--text);text-decoration:none;font-weight:900;font-size:1.2rem}.logo-mark{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),#7C3AED);border-radius:10px;margin-left:.4rem}.back{color:var(--primary);text-decoration:none}main{max-width:760px;margin:auto;padding:106px 1rem 3rem}.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:1.4rem}.summary{display:grid;gap:.8rem}.item{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--border)}.item:last-child{border-bottom:0}.muted{color:var(--muted);font-size:.9rem}.total{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:900;color:var(--primary);margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}.notice{margin-top:1rem;padding:1rem;border:1px dashed var(--primary);border-radius:14px;background:rgba(0,212,255,.06)}.payment-box{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}.status{color:var(--muted);font-size:.88rem;margin-top:.75rem}.secondary{display:flex;justify-content:center;align-items:center;min-height:48px;margin-top:.8rem;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);border-radius:12px;text-decoration:none;font-weight:900}@media(max-width:520px){main{padding:92px .8rem 2rem}.card{padding:1rem;border-radius:18px}.item{align-items:flex-start;flex-direction:column;gap:.2rem}}
  </style>

<body>
  <nav><a class="logo" href="index.html"><span class="logo-mark">🧠</span>MindWeave</a><a class="back" href="cart.html">العودة للسلة</a></nav>
  <main><div class="card"><h1>مراجعة الطلب</h1><p class="muted">تحقق من المنتجات قبل الانتقال إلى الدفع.</p><div id="summary" class="summary"></div><div id="notice" class="notice">جاري التحقق من إعدادات PayPal الآمنة...</div><div class="payment-box"><div id="paypal-button-container"></div><div id="paymentStatus" class="status"></div></div><a class="secondary" href="store.html">متابعة التسوق</a></div></main>
  <script>
    const cart = JSON.parse(localStorage.getItem('mw_cart') || '[]');
    const summary = document.getElementById('summary');
    const notice = document.getElementById('notice');
    const paymentStatus = document.getElementById('paymentStatus');
    const price = item => Number.parseFloat(String(item.price || '0').replace(/[^0-9.]/g,'')) || 0;
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    const total = cart.reduce((sum,item)=>sum+price(item),0);
    const productIds = cart.map(item => Number(item.id)).filter(Number.isInteger);
    summary.innerHTML = cart.length ? cart.map(item => `<div class="item"><span>${escapeHtml(typeof item.name==='object' ? item.name.ar : item.name)}</span><strong>$${price(item).toFixed(2)}</strong></div>`).join('') + `<div class="total"><span>الإجمالي</span><span>$${total.toFixed(2)}</span></div>` : '<p class="muted">السلة فارغة. <a href="store.html">اختر منتجًا أولًا</a></p>';

    function loadPayPalSdk(clientId) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(clientId)}&currency=USD&intent=capture&components=buttons`;
        script.onload = resolve; script.onerror = reject; document.head.appendChild(script);
      });
    }
    async function startPayPal() {
      if (!cart.length) { notice.textContent = 'السلة فارغة. أضف منتجًا أولاً.'; return; }
      try {
        const config = await fetch('/api/paypal/config', { cache: 'no-store' }).then(response => response.json());
        if (!config.enabled || !config.clientId) { notice.textContent = 'PayPal غير مفعّل بعد. أضف PAYPAL_CLIENT_ID وPAYPAL_CLIENT_SECRET في إعدادات الخادم، ثم أعد المحاولة.'; return; }
        await loadPayPalSdk(config.clientId);
        notice.textContent = `الدفع عبر PayPal (${config.environment === 'sandbox' ? 'وضع الاختبار' : 'الوضع الحي'})`;
        window.paypal.Buttons({
          style: { layout: 'vertical', shape: 'rect', label: 'paypal', height: 48 },
          createOrder: async () => {
            if (window.mwTrack) window.mwTrack('begin_checkout', { item_count: productIds.length });
            const response = await fetch('/api/paypal/orders', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ productIds }) });
            const data = await response.json();
            if (!response.ok || !data.id) throw new Error(data.error || 'تعذر إنشاء طلب PayPal');
            return data.id;
          },
          onApprove: async (data) => {
            paymentStatus.textContent = 'جارٍ تأكيد الدفع...';
            const session = window.supabaseClient ? (await window.supabaseClient.auth.getSession()).data.session : null;
            const response = await fetch(`/api/paypal/orders/${encodeURIComponent(data.orderID)}/capture`, { method: 'POST', headers: session?.access_token ? { Authorization: `Bearer ${session.access_token}` } : {} });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.error || 'تعذر تأكيد الدفع');
            localStorage.removeItem('mw_cart');
            if (window.mwTrack) window.mwTrack('purchase', { transaction_id: result.orderId, value: total, currency: 'USD', item_count: productIds.length, payment_environment: config.environment, payment_recorded: Boolean(result.recorded) });
            notice.textContent = result.recorded ? 'تم تأكيد الدفع وتسجيل الطلب في حسابك.' : 'تم تأكيد الدفع، لكن يحتاج ربط الحساب لمزامنة الطلب مع سجل المشتريات.';
            paymentStatus.textContent = `رقم الطلب: ${result.orderId}`;
            document.getElementById('paypal-button-container').innerHTML = '<p>شكرًا لك. سيتم تجهيز وصولك الرقمي.</p>';
          },
          onCancel: () => { paymentStatus.textContent = 'تم إلغاء الدفع. يمكنك المحاولة مرة أخرى.'; },
          onError: (error) => { console.error(error); paymentStatus.textContent = 'تعذر إكمال الدفع. حاول مرة أخرى.'; }
        }).render('#paypal-button-container');
      } catch (error) {
        console.error(error); notice.textContent = 'تعذر تحميل PayPal حاليًا. لم يتم خصم أي مبلغ.';
      }
    }
    window.supabaseClient = window.supabase?.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY);
    startPayPal();
  </script>
  <script src="analytics.js?v=20261109"></script>
</body>
