    .nav-links a { color: var(--text-muted); text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; }
    .nav-links a:hover, .nav-links a.active { color: var(--primary); background: rgba(0, 212, 255, 0.1); }
    .nav-buttons { display: flex; gap: 1rem; align-items: center; }
    .lang-btn, .cart-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; }
    main { max-width: 1000px; margin: 0 auto; padding: 120px 2rem 4rem; text-align: center; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; margin-top: 3rem; }
    .resource-card { background: var(--bg-card); border: 1px solid var(--border); padding: 2rem; border-radius: 20px; text-align: right; transition: 0.3s; }
    body[data-lang="en"] .resource-card, body[data-lang="es"] .resource-card, body[data-lang="fr"] .resource-card { text-align: left; }
    .resource-card:hover { transform: translateY(-5px); border-color: var(--primary); }
    .resource-icon { font-size: 3rem; margin-bottom: 1rem; }
    .btn-download { display: inline-block; margin-top: 1.5rem; background: var(--primary); color: var(--bg); padding: 0.6rem 1.5rem; border-radius: 10px; text-decoration: none; font-weight: 700; transition: 0.3s; }

    </div>
  </footer>

  <script>
    let currentLang = localStorage.getItem('mw_lang') || 'ar';

    const resources = [
      {
        icon: "📚",
        title: { ar: "دليل المبتدئين في ChatGPT", en: "ChatGPT Beginner's Guide", es: "Guía de ChatGPT para principiantes", fr: "Guide ChatGPT pour débutants" },
        desc: { ar: "كل ما تحتاجه للبدء في استخدام ChatGPT بفعالية.", en: "Everything you need to start using ChatGPT effectively.", es: "Todo lo que necesitas para empezar a usar ChatGPT con eficacia.", fr: "Tout ce dont vous avez besoin pour commencer à utiliser ChatGPT efficacement." }
      },
      {
        icon: "🎨",
        title: { ar: "قوالب Midjourney مذهلة", en: "Amazing Midjourney Prompts", es: "Prompts increíbles de Midjourney", fr: "Prompts Midjourney incroyables" },
        desc: { ar: "مجموعة من الأوامر الجاهزة لتوليد صور احترافية.", en: "A collection of ready-made prompts for professional image generation.", es: "Una colección de prompts listos para la generación de imágenes profesionales.", fr: "Une collection de prompts prêts à l'emploi pour la génération d'images professionnelles." }
      },
      {
        icon: "📊",
        title: { ar: "قالب Notion لتنظيم العمل", en: "Notion Workflow Template", es: "Plantilla de flujo de trabajo de Notion", fr: "Template de flux de travail Notion" },
        desc: { ar: "نظم مشاريعك وأفكارك باستخدام هذا القالب المجاني.", en: "Organize your projects and ideas with this free template.", es: "Organiza tus proyectos e ideas con esta plantilla gratuita.", fr: "Organisez vos projets et vos idées avec ce template gratuit." }
      }
    ];

    function renderResources() {
      const grid = document.getElementById('resourceGrid');
      grid.innerHTML = resources.map(r => `
        <div class="resource-card">
          <div class="resource-icon">${r.icon}</div>
          <h3>${r.title[currentLang]}</h3>
          <p>${r.desc[currentLang]}</p>
          <a href="#" class="btn-download">${currentLang === 'ar' ? 'تحميل مجاني' : 'Free Download'}</a>
        </div>
      `).join('');
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('mw_cart') || '[]');
      document.getElementById('cartCount').textContent = cart.length;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderResources();
      updateCartCount();
      document.body.setAttribute('data-lang', currentLang);
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    });
  </script>
