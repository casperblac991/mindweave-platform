  <style>
    *{box-sizing:border-box}:root{--primary:#00D4FF;--bg:#050A0F;--card:#0A1628;--text:#E8F4FD;--muted:#7A9BB5;--border:rgba(0,212,255,.2)}
    body{display:none;margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif;line-height:1.6}nav{position:fixed;inset:0 0 auto;height:68px;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;background:rgba(5,10,15,.95);border-bottom:1px solid var(--border)}.logo{color:var(--text);text-decoration:none;font-weight:900;font-size:1.25rem}.back{color:var(--primary);text-decoration:none}.nav-actions{display:flex;gap:.6rem;align-items:center}.cart-count{border:1px solid var(--border);border-radius:9px;padding:.35rem .65rem}main{max-width:840px;margin:auto;padding:105px 1rem 3rem}.cart-container{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:1.4rem}.cart-item{display:grid;grid-template-columns:1fr auto auto;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--border)}.cart-item:last-child{border-bottom:0}.item-name{font-weight:700}.item-meta{color:var(--muted);font-size:.85rem}.item-price{color:var(--primary);font-weight:900;white-space:nowrap}.remove-btn{min-height:40px;border:1px solid rgba(255,107,53,.5);border-radius:9px;background:transparent;color:#FF8A65;padding:.45rem .7rem;font:inherit;cursor:pointer}.empty-cart{text-align:center;padding:2.5rem 1rem;color:var(--muted)}.empty-cart a{display:inline-flex;margin-top:1rem;color:var(--bg);background:var(--primary);border-radius:10px;padding:.65rem 1rem;text-decoration:none;font-weight:900}.summary{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border);font-size:1.35rem;font-weight:900;color:var(--primary)}.checkout{display:flex;justify-content:center;align-items:center;width:100%;min-height:50px;margin-top:1rem;background:var(--primary);color:var(--bg);border:0;border-radius:12px;font:inherit;font-weight:900;cursor:pointer;text-decoration:none}.hint{color:var(--muted);font-size:.85rem;text-align:center;margin-top:.8rem}@media(max-width:560px){nav{height:62px;padding:0 .8rem}.logo{font-size:1.05rem}main{padding:90px .75rem 2rem}.cart-container{padding:1rem;border-radius:18px}.cart-item{grid-template-columns:1fr auto;gap:.65rem}.item-price{grid-column:2;grid-row:1}.remove-btn{grid-column:1;grid-row:2;justify-self:start}.item-meta{grid-column:1;grid-row:2}.summary{font-size:1.15rem}}
  </style>

<body>
  <nav><a class="logo" href="index.html">🧠 Mind<span>Weave</span></a><div class="nav-actions"><a class="back" href="store.html">متابعة التسوق</a><span class="cart-count">🛒 <span id="cartCount">0</span></span></div></nav>
  <main><h1>سلة التسوق</h1><p class="hint" style="text-align:right;margin-bottom:1rem">راجع المنتجات قبل الانتقال إلى صفحة الدفع.</p><div class="cart-container" id="cartContainer"></div><div id="cartActions" style="display:none"><div class="summary"><span>الإجمالي</span><span id="cartTotal">$0.00</span></div><a class="checkout" id="checkoutBtn" href="checkout.html">مراجعة الطلب والدفع</a><p class="hint">لن يتم خصم أي مبلغ قبل تفعيل مزود دفع حقيقي.</p></div></main>
  <script>
    const getCart=()=>JSON.parse(localStorage.getItem('mw_cart')||'[]');
    const amount=item=>Number.parseFloat(String(item.price||'0').replace(/[^0-9.]/g,''))||0;
    const name=item=>typeof item.name==='object'?(item.name.ar||item.name.en):item.name;
    function removeItem(id){localStorage.setItem('mw_cart',JSON.stringify(getCart().filter(item=>item.id!==id)));if(window.mwTrack)window.mwTrack('remove_from_cart',{item_id:id});renderCart();}
    function renderCart(){const cart=getCart(),container=document.getElementById('cartContainer');document.getElementById('cartCount').textContent=cart.length;if(!cart.length){container.innerHTML='<div class="empty-cart">السلة فارغة حالياً<br><a href="store.html">اكتشف المنتجات</a></div>';document.getElementById('cartActions').style.display='none';return;}container.innerHTML=cart.map(item=>`<div class="cart-item"><div><div class="item-name">${name(item)}</div><div class="item-meta">منتج رقمي · وصول فوري بعد الدفع</div></div><div class="item-price">$${amount(item).toFixed(2)}</div><button class="remove-btn" type="button" data-remove="${item.id}">حذف</button></div>`).join('');container.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click',()=>removeItem(Number(btn.dataset.remove))));document.getElementById('cartTotal').textContent='$'+cart.reduce((sum,item)=>sum+amount(item),0).toFixed(2);document.getElementById('cartActions').style.display='block';}
    document.addEventListener('DOMContentLoaded',renderCart);
  </script>
  <script src="ai-assistant.js?v=20260812-1"></script><script src="analytics.js?v=20261109"></script>
</body>
