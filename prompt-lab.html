<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Lab | MindWeave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #00D4FF; --bg: #050A0F; --bg-card: #0A1628;
      --text: #E8F4FD; --text-muted: #7A9BB5; --border: rgba(0,212,255,0.2);
    }
    body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; line-height: 1.6; }
    nav { position: fixed; top: 0; left: 0; right: 0; background: rgba(5, 10, 15, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 70px; display: flex; align-items: center; justify-content: space-between; z-index: 1000; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 900; color: var(--text); text-decoration: none; }
    .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), #7C3AED); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    main { max-width: 1000px; margin: 0 auto; padding: 120px 2rem 4rem; }
    .lab-header { text-align: center; margin-bottom: 3rem; }
    .lab-header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .lab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 768px) { .lab-grid { grid-template-columns: 1fr; } }
    @media (max-width:560px) { .workbench-grid { grid-template-columns:1fr; } .lab-card { padding:1.25rem; } }
    .lab-card { background: var(--bg-card); border: 1px solid var(--border); padding: 2rem; border-radius: 24px; display: flex; flex-direction: column; height: 100%; }
    .input-group { margin-bottom: 1.5rem; }
    .workbench-grid { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; margin-bottom:1.25rem; }
    .workbench-grid .input-group { margin-bottom:0; }
    .field-help { color:var(--text-muted); font-size:.76rem; margin-top:.3rem; }
    .draft-actions { display:flex; gap:.55rem; margin-top:.75rem; }
    .draft-actions button { flex:1; min-height:42px; border:1px solid var(--border); border-radius:10px; background:transparent; color:var(--text); cursor:pointer; font:inherit; }
    .draft-actions button:hover { border-color:var(--primary); color:var(--primary); }
    label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
    select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: white; padding: 1rem; font-family: inherit; }
    textarea { height: 250px; resize: none; }
    .btn-test { background: var(--primary); color: var(--bg); padding: 1rem 2rem; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
    .btn-test:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,212,255,0.4); }
    .btn-test:disabled { opacity: 0.6; cursor: not-allowed; }
    .result-area { margin-top: 1.5rem; padding: 1.5rem; background: rgba(0,212,255,0.05); border-radius: 12px; border: 1px dashed var(--primary); display: none; position: relative; flex-grow: 1; }
    .copy-btn { position: absolute; top: 1rem; left: 1rem; background: var(--primary); color: var(--bg); border: none; border-radius: 6px; padding: 0.3rem 0.7rem; font-size: 0.8rem; cursor: pointer; }
    .prompt-suggestions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .product-context { display: none; margin: 0 auto 1.5rem; max-width: 760px; padding: .85rem 1rem; border: 1px solid var(--border); border-radius: 14px; background: rgba(0,212,255,.06); color: var(--muted); }
    .product-context strong { color: var(--text); }
    .product-context a { color: var(--primary); text-decoration: none; font-weight: 700; }
    .suggestion-chip { background: var(--bg); border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
    .suggestion-chip:hover { border-color: var(--primary); color: var(--primary); }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(0,0,0,0.1); border-top-color: var(--bg); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo"><div class="logo-icon">🧠</div>Mind<span>Weave</span></a>
  </nav>

  <main>
    <div class="lab-header">
      <h1>Prompt Lab ✨</h1>
      <p>صمم، اختبر، وحسّن أوامرك باستخدام الذكاء الاصطناعي قبل استخدامها</p>
    </div>
    <div class="product-context" id="productContext"></div>

    <div class="lab-grid">
      <div class="lab-card">
        <div class="workbench-grid" aria-label="حقول بناء الأمر">
          <div class="input-group">
            <label for="taskSelect">ما المهمة التي تريد إنجازها؟</label>
            <select id="taskSelect">
              <option value="">اختر مهمة أو اكتبها في المسودة</option>
              <option value="كتابة محتوى واضح">كتابة محتوى واضح</option>
              <option value="خطة تسويقية عملية">خطة تسويقية عملية</option>
              <option value="تلخيص وتحليل نص">تلخيص وتحليل نص</option>
              <option value="تنظيم مشروع ومهام">تنظيم مشروع ومهام</option>
            </select>
            <p class="field-help">تحديد المهمة يقلل التخمين في النتيجة.</p>
          </div>
          <div class="input-group">
            <label for="audienceInput">من الجمهور المستهدف؟</label>
            <input id="audienceInput" type="text" maxlength="120" placeholder="مثال: أصحاب المشاريع الصغيرة" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:white;padding:1rem;font:inherit;">
            <p class="field-help">اختياري، ولا يُرسل إلى التحليلات.</p>
          </div>
          <div class="input-group">
            <label for="formatSelect">شكل الناتج</label>
            <select id="formatSelect">
              <option value="نص منظم بعناوين">نص منظم بعناوين</option>
              <option value="قائمة خطوات عملية">قائمة خطوات عملية</option>
              <option value="جدول مختصر">جدول مختصر</option>
              <option value="JSON منظم">JSON منظم</option>
            </select>
          </div>
          <div class="input-group">
            <label for="constraintsInput">قيود الجودة</label>
            <input id="constraintsInput" type="text" maxlength="180" placeholder="مثال: لغة عربية، مختصر، دون مبالغة" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:white;padding:1rem;font:inherit;">
          </div>
        </div>
        <div class="input-group">
          <label>النموذج المستهدف</label>
          <select id="modelSelect">
            <option value="gpt4">ChatGPT (GPT-4)</option>
            <option value="claude">Claude 3.5 Sonnet</option>
            <option value="midjourney">Midjourney v6</option>
            <option value="dalle">DALL-E 3</option>
          </select>
        </div>
        <div class="input-group">
          <label>اكتب مسودة الأمر الخاص بك</label>
          <textarea id="promptInput" placeholder="مثال: اكتب لي مقالاً عن فوائد القهوة..."></textarea>
          <div class="prompt-suggestions" id="suggestionContainer"></div>
          <div class="draft-actions"><button type="button" id="saveDraftBtn">حفظ المسودة على هذا الجهاز</button><button type="button" id="clearDraftBtn">مسح الحقول</button></div>
        </div>
        <button class="btn-test" id="testBtn">⚗️ حسّن الأمر الآن</button>
      </div>

      <div class="lab-card">
        <div class="input-group">
          <label>الأمر المحسن (النتيجة)</label>
          <div class="result-area" id="resultArea">
            <button class="copy-btn" id="copyBtn">نسخ</button>
            <div id="resultContent" style="white-space: pre-wrap;"></div>
          </div>
          <div id="placeholderText" style="color: var(--text-muted); text-align: center; padding: 4rem 0;">
            اضغط على "حسّن الأمر" لرؤية السحر هنا ✨
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const testBtn = document.getElementById('testBtn');
    const resultArea = document.getElementById('resultArea');
    const resultContent = document.getElementById('resultContent');
    const placeholderText = document.getElementById('placeholderText');
    const promptInput = document.getElementById('promptInput');
    const suggestionContainer = document.getElementById('suggestionContainer');
    const productContext = document.getElementById('productContext');
    const taskSelect = document.getElementById('taskSelect');
    const audienceInput = document.getElementById('audienceInput');
    const formatSelect = document.getElementById('formatSelect');
    const constraintsInput = document.getElementById('constraintsInput');
    const draftKey = 'mindweave_prompt_workbench_draft_v1';
    const MAX_PROMPT_LENGTH = 2000;
    promptInput.maxLength = MAX_PROMPT_LENGTH;
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));

    const productId = Number(new URLSearchParams(location.search).get('product'));
    if (productId) {
      fetch('content-data.json?v=' + Date.now()).then(response => response.json()).then(data => {
        const product = data.products.find(item => item.id === productId);
        if (!product) return;
        const productName = typeof product.name === 'object' ? (product.name.ar || product.name.en) : product.name;
        productContext.innerHTML = `تعمل الآن على تحسين أوامر مرتبطة بـ <strong>${escapeHtml(productName)}</strong>. <a href="product.html?id=${encodeURIComponent(product.id)}">العودة إلى تفاصيل المنتج</a>`;
        productContext.style.display = 'block';
        promptInput.placeholder = `اكتب مسودة مرتبطة بـ ${productName}...`;
      }).catch(() => {});
    }

    const suggestions = [
      "اكتب مقالاً تقنياً",
      "صمم شعاراً مودرن",
      "ترجم نصاً قانونياً",
      "لخص كتاباً"
    ];

    suggestionContainer.innerHTML = suggestions.map(s => `<span class="suggestion-chip">${s}</span>`).join('');

    function readDraft() {
      try { return JSON.parse(localStorage.getItem(draftKey) || 'null'); } catch (_) { return null; }
    }
    function applyDraft(draft) {
      if (!draft) return;
      taskSelect.value = draft.task || '';
      audienceInput.value = draft.audience || '';
      formatSelect.value = draft.format || 'نص منظم بعناوين';
      constraintsInput.value = draft.constraints || '';
      promptInput.value = draft.prompt || '';
    }
    applyDraft(readDraft());
    document.getElementById('saveDraftBtn').addEventListener('click', () => {
      localStorage.setItem(draftKey, JSON.stringify({ task: taskSelect.value, audience: audienceInput.value.trim(), format: formatSelect.value, constraints: constraintsInput.value.trim(), prompt: promptInput.value.trim() }));
      if (window.mwTrack) window.mwTrack('prompt_draft_saved', { page_type: 'prompt-lab' });
    });
    document.getElementById('clearDraftBtn').addEventListener('click', () => {
      localStorage.removeItem(draftKey);
      [taskSelect, audienceInput, constraintsInput, promptInput].forEach((field) => { field.value = ''; });
      formatSelect.value = 'نص منظم بعناوين';
      resultArea.style.display = 'none';
      placeholderText.style.display = 'block';
    });

    document.querySelectorAll('.suggestion-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        promptInput.value = chip.textContent;
      });
    });

    testBtn.addEventListener('click', async () => {
      const rawPrompt = promptInput.value.trim();
      const promptParts = [
        taskSelect.value && `المهمة: ${taskSelect.value}`,
        audienceInput.value.trim() && `الجمهور: ${audienceInput.value.trim()}`,
        `شكل الناتج: ${formatSelect.value}`,
        constraintsInput.value.trim() && `قيود الجودة: ${constraintsInput.value.trim()}`,
        rawPrompt && `المسودة: ${rawPrompt}`
      ].filter(Boolean);
      const prompt = promptParts.join('\n');
      if (!prompt) { resultContent.textContent = 'اكتب مسودة الأمر أولاً.'; resultArea.style.display = 'block'; return; }
      if (prompt.length > MAX_PROMPT_LENGTH) { resultContent.textContent = `الحد الأقصى ${MAX_PROMPT_LENGTH} حرف.`; resultArea.style.display = 'block'; return; }

      testBtn.innerHTML = '<span class="spinner"></span> جاري التحسين...';
      testBtn.disabled = true;
      placeholderText.style.display = 'none';
      resultArea.style.display = 'none';
      try {
        const response = await fetch('/api/prompt/enhance', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ prompt, language: document.documentElement.lang || 'ar', targetModel: document.getElementById('modelSelect').value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'تعذر تحسين الأمر.');
        resultContent.textContent = data.answer;
        resultArea.style.display = 'block';
        if (window.mwTrack) window.mwTrack('generate_prompt', { target_model: data.targetModel });
        if (window.mwTrack) window.mwTrack('prompt_workbench_run', { task: taskSelect.value || 'custom', output_format: formatSelect.value });
      } catch (error) {
        resultContent.textContent = error.message || 'تعذر تحسين الأمر حالياً.';
        resultArea.style.display = 'block';
      } finally {
        testBtn.innerHTML = '⚗️ حسّن الأمر الآن';
        testBtn.disabled = false;
      }
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(resultContent.textContent);
      alert('تم نسخ الأمر المحسن!');
    });
  </script>
  <script src="ai-assistant.js?v=20260812-1"></script>
  <script src="analytics.js?v=20261109"></script>
</body>
</html>
