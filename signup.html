  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #00D4FF; --bg: #050A0F; --bg-card: #0A1628;
      --text: #E8F4FD; --text-muted: #7A9BB5; --border: rgba(0,212,255,0.2);
    }
    body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); padding: 2.5rem; border-radius: 24px; width: 100%; max-width: 450px; }
    .logo { text-align: center; margin-bottom: 2rem; font-size: 1.5rem; font-weight: 900; text-decoration: none; color: white; display: block; }
    .logo span { color: var(--primary); }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); }
    input { width: 100%; padding: 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: white; font-family: inherit; }
    .btn-auth { width: 100%; background: var(--primary); color: var(--bg); padding: 1rem; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,212,255,0.3); }
    .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; }
    .switch-auth { text-align: center; margin-top: 1.5rem; color: var(--text-muted); }
    .switch-auth a { color: var(--primary); text-decoration: none; }
    .form-help { display: block; margin-top: 0.45rem; color: var(--text-muted); font-size: 0.78rem; }
    .form-status { display: none; margin: 1rem 0; padding: 0.85rem 1rem; border-radius: 10px; font-size: 0.9rem; line-height: 1.7; }
    .form-status.show { display: block; }
    .form-status.error { color: #ffd6d6; background: rgba(255, 75, 75, 0.12); border: 1px solid rgba(255, 75, 75, 0.35); }
    .form-status.success { color: #d9fff0; background: rgba(0, 212, 150, 0.12); border: 1px solid rgba(0, 212, 150, 0.35); }
  </style>
</head>
<body>
  <div class="auth-card">
    <a href="index.html" class="logo">🧠 Mind<span>Weave</span></a>
    <h2 style="text-align: center; margin-bottom: 0.5rem;">إنشاء حساب جديد</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.6rem; font-size: 0.9rem;">أنشئ حسابك للوصول إلى لوحة التحكم وحفظ مشترياتك.</p>
    <form id="signupForm">
      <div class="form-group">
        <label for="fullName">الاسم الكامل</label>
        <input type="text" id="fullName" name="fullName" autocomplete="name" required minlength="2" placeholder="أدخل اسمك">
      </div>
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required placeholder="example@mail.com">
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6" placeholder="••••••••">
        <small class="form-help">اختر كلمة مرور قوية من 6 أحرف على الأقل. بعد نجاح إنشاء الحساب ستصل رسالة التفعيل إلى بريدك.</small>
      </div>
      <div id="formStatus" class="form-status" role="status" aria-live="polite"></div>
      <button type="submit" class="btn-auth" id="submitBtn">إنشاء الحساب</button>
    </form>
    <div class="switch-auth">
      لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailField = document.getElementById('email');
      const email = emailField.value.trim().toLowerCase().replace(/\s+/g, '');
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value.trim();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('formStatus');
      const showStatus = (message, type) => {
        status.textContent = message;
        status.className = `form-status show ${type}`;
      };

      if (fullName.length < 2) return showStatus('يرجى إدخال الاسم الكامل.', 'error');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showStatus('يرجى إدخال بريد إلكتروني صحيح، من دون مسافات أو رموز زائدة.', 'error');
      emailField.value = email;
      if (password.length < 6) return showStatus('يجب أن تتكون كلمة المرور من 6 أحرف أو أكثر.', 'error');

      btn.disabled = true;
      btn.textContent = 'جاري إنشاء الحساب...';
      status.className = 'form-status';

      try {
        const result = await signUpUser(email, password, fullName);
        if (result.success) {
          showStatus(result.message, 'success');
          setTimeout(() => {
            window.location.href = result.needsVerification ? 'login.html?verified=pending' : 'dashboard.html';
          }, 1400);
        } else {
          showStatus(result.message, 'error');
          btn.disabled = false;
          btn.textContent = 'إنشاء الحساب';
        }
      } catch (error) {
        showStatus('حدث خطأ غير متوقع. حاول مرة أخرى.', 'error');
        btn.disabled = false;
        btn.textContent = 'إنشاء الحساب';
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
